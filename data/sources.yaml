# Every constant any ClaimGuard rule or impact-panel number uses must have
# an entry here (SOLUTION.md principle P3: "No source, no rule").
#
# status: CITED      -> read by this team, document + locator given
#         DEMO_VALUE  -> not yet backed by a document we have read; a rule
#                        that uses it still runs, but its result and the UI
#                        carry a visible DEMO VALUE badge
#
# Facility-specific numbers (rated_t_per_hr, hours_per_day, etc.) live in
# data/facilities.json, not here, because they differ per plant. This file
# holds only the formula source and the fractions/bands rules apply to any
# facility's numbers.
#
# Changing a `status` from DEMO_VALUE to CITED requires having actually read
# the cited document (docs/team/MRUDDUNI.md section 3.1).

- id: cpcb-capacity-guideline
  title: "CPCB guidance on recycler capacity, as filed before the National Green Tribunal"
  status: CITED
  date: "2025-07-02"
  locator: "worked example, capacity formula (rate x hours/day x operating days)"
  url: null
  value: null
  note: >
    problem_statement.md section "Scope for a four-day build": the worked
    example in the regulator's own capacity guideline prints
    20 h x 4 t/h x 330 d = 46,200 t. The correct product is 26,400 t. R1 uses
    the correct arithmetic and shows the erratum on the claim card. We have
    not read the primary filing; the figure comes from the problem statement,
    which itself cites the CPCB affidavit of 2 July 2025.

- id: lead-fraction-lead-acid-max
  title: "Maximum recoverable lead fraction, lead-acid battery, by weight"
  status: DEMO_VALUE
  value: 0.65
  note: >
    Not yet backed by a published CPCB or BIS composition table. A
    conventional flooded lead-acid battery is commonly described as roughly
    60-70% lead and lead compounds by weight; 0.65 is a placeholder upper
    bound for R2(b) until a cited composition table replaces it. Find and
    cite before the demo, or keep the DEMO VALUE badge visible.

