- id: erickshaw-battery-total-weight-kg
  title: "Approximate total weight of one used e-rickshaw lead-acid battery"
  status: DEMO_VALUE
  value: 30
  note: >
    Used only to size demo handover events (CONTRACT.md section 8), not in
    any rule. SOLUTION.md's own Journey A example ("4 batteries, about 80 kg")
    implies 20 kg per battery, which is too light if lead content alone is
    already 20 kg per battery (see lead-per-battery-kg above). 30 kg total is
    a more plausible whole-battery weight; told to Mrudduni, not yet sourced.

- id: energy-band-lead-smelting-kwh-per-t
  title: "Plausible electricity use per tonne of output, small-scale lead secondary smelting"
  status: DEMO_VALUE
  value: [150, 450]
  note: >
    [min, max] kWh per tonne of processed output. Not yet calibrated against
    real Indian plant data (SOLUTION.md section 20: "Real energy-per-tonne
    bands ... R3 stays SOFT and labelled until calibrated"). R3 is SOFT-only
    regardless, so a wrong band produces a wrong amber flag, never a wrong
    HARD flag.

- id: energy-band-ewaste-dismantling-kwh-per-t
  title: "Plausible electricity use per tonne of output, e-waste dismantling only (no smelting)"
  status: DEMO_VALUE
  value: [20, 80]
  note: >
    Used for the Hapur-style case (C-104): tonnage consistent with dismantling
    only, not full recovery. Not yet calibrated.

- id: ipcc-gwp100-r32
  title: "100-year global warming potential, R-32 (HFC-32)"
  status: DEMO_VALUE
  value: 771
  note: >
    Secondary source only (not the primary IPCC table) as of this session:
    several refrigerant fact sheets report 771 for AR6 GWP-100. Verify
    against IPCC AR6 WG1 Chapter 7 Supplementary Material, Table 7.SM.7,
    before marking CITED.

- id: ipcc-gwp100-r410a
  title: "100-year global warming potential, R-410A"
  status: DEMO_VALUE
  value: 2255
  note: "Same caveat as ipcc-gwp100-r32. Secondary sources give about 2,255 for AR6."

- id: ipcc-gwp100-r22
  title: "100-year global warming potential, R-22 (HCFC-22)"
  status: DEMO_VALUE
  value: 1960
  note: >
    Secondary sources disagree: about 1,960 under AR6 vs an older, commonly
    quoted 1,810 (which looks AR4-based). Verify against the primary IPCC
    AR6 table before marking CITED, and before the demo pick one and say why.

