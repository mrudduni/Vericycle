[project]
name = "oae-ledger"
version = "0.1.0"
description = "OpenAEye ChainTrack tamper-evident custody ledger"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledger"]

[tool.pytest.ini_options]
testpaths = ["../../tests/chaintrack"]
