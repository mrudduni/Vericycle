[project]
name = "claimguard"
version = "0.1.0"
description = "OpenAEye ClaimGuard: deterministic recycling-claim checker"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "pillow>=10.4",
  "imagehash>=4.3",
  "piexif>=1.1.3",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["../../tests/claimguard"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimguard"]
